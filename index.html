<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ministério de Louvor | Map Music</title>
<style>
:root {
  --fundo: #0f172a;
  --fundo-card: #1e293b;
  --texto: #f1f5f9;
  --texto-suave: #94a3b8;
  --primaria: #10B981;
  --secundaria: #3b82f6;
  --perigo: #ef4444;
  --aviso: #f59e0b;
  --borda: #334155;
  --sucesso: #22c55e;
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
body { background: var(--fundo); color: var(--texto); min-height: 100vh; }
.tela { display: none; padding: 20px; max-width: 900px; margin: 0 auto; }
.tela.ativa { display: block; }
.login-tela { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
.login-container { background: var(--fundo-card); padding: 40px 30px; border-radius: 16px; max-width: 400px; width: 100%; border: 1px solid var(--borda); text-align: center; }
.login-logo { font-size: 48px; margin-bottom: 10px; }
.login-container h2 { color: var(--primaria); font-size: 22px; margin-bottom: 5px; }
.login-container p { color: var(--texto-suave); margin-bottom: 25px; }
.input-group { margin-bottom: 20px; text-align: left; }
.input-group label { display: block; margin-bottom: 8px; color: var(--texto-suave); font-size: 14px; }
.input-group input { width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid var(--borda); background: var(--fundo); color: var(--texto); font-size: 16px; }
.btn { padding: 12px 20px; border-radius: 8px; border: none; font-size: 15px; cursor: pointer; font-weight: 500; transition: all 0.2s; }
.btn-primario { background: var(--primaria); color: white; width: 100%; }
.btn-primario:hover { opacity: 0.9; }
.btn-perigo { background: var(--perigo); color: white; }
.btn-pequeno { padding: 6px 12px; font-size: 13px; }
.btn-sucesso { background: var(--sucesso); color: white; }
.cabecalho { text-align: center; padding: 20px 0; margin-bottom: 20px; border-bottom: 1px solid var(--borda); }
.cabecalho h1 { font-size: 22px; color: var(--primaria); }
.navegacao { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; justify-content: center; }
.nav-btn { background: var(--fundo-card); color: var(--texto-suave); border: 1px solid var(--borda); }
.nav-btn.ativo { background: var(--primaria); color: white; border-color: var(--primaria); }
.sair-btn { position: absolute; top: 20px; right: 20px; background: var(--perigo); color: white; border: none; }
.card { background: var(--fundo-card); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--borda); }
.card h3 { color: var(--primaria); margin-bottom: 15px; font-size: 18px; }
.linha-form { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 15px; align-items: flex-end; }
.campo { flex: 1; min-width: 140px; }
.campo label { display: block; font-size: 13px; color: var(--texto-suave); margin-bottom: 5px; }
.campo input, .campo select { width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--borda); background: var(--fundo); color: var(--texto); font-size: 15px; }
.lista-itens { list-style: none; }
.item { padding: 12px; border-bottom: 1px solid var(--borda); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.item-nome { font-weight: 500; }
.item-info { font-size: 13px; color: var(--texto-suave); }
.acoes { display: flex; gap: 6px; }
.status-btn { padding: 4px 10px; border-radius: 20px; font-size: 12px; border: none; cursor: pointer; font-weight: 500; transition: all 0.2s; }
.status-pendente { background: var(--aviso); color: #000; }
.status-confirmado { background: var(--sucesso); color: white; }
.status-recusado { background: var(--perigo); color: white; }
.ensaiada { background: var(--sucesso); color: white; }
.nao-ensaiada { background: var(--perigo); color: white; }
.btn-whatsapp { background: #25D366; color: white; }
.escala-grade { display: grid; gap: 12px; }
.escala-linha { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--fundo); border-radius: 8px; border: 1px solid var(--borda); flex-wrap: wrap; gap: 8px; }
.escala-cargo { font-weight: 500; display: flex; align-items: center; gap: 8px; min-width: 100px; }
.escala-nome { flex: 1; min-width: 140px; }
.escala-nome input { width: 100%; padding: 6px 8px; border-radius: 4px; border: 1px solid var(--borda); background: var(--fundo-card); color: var(--texto); text-align: center; font-size: 14px; }
.escala-status { display: flex; gap: 6px; }
.oculto { display: none !important; }
.vazio { text-align: center; padding: 30px; color: var(--texto-suave); font-style: italic; }
a { color: var(--secundaria); text-decoration: none; }
.botoes { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
.seletor-data { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 15px; }
.seletor-data select, .seletor-data input { flex: 1; min-width: 140px; }
</style>
</head>
<body>
<div id="tela-login" class="login-tela">
  <div class="login-container">
    <div class="login-logo">🎵</div>
    <h2>Ministério de Louvor</h2>
    <p>Map Music</p>
    <div id="msg-login" style="margin-bottom:15px; color: var(--perigo);"></div>
    <div class="input-group">
      <label>Usuário</label>
      <input type="text" id="usuario" autocomplete="off">
    </div>
    <div class="input-group">
      <label>Senha</label>
      <input type="password" id="senha">
    </div>
    <button class="btn btn-primario" onclick="entrar()">Entrar</button>
  </div>
</div>

<div id="tela-principal" class="tela">
  <button class="btn sair-btn" onclick="sair()">Sair</button>
  <header class="cabecalho">
    <h1>🎵 Ministério de Louvor | Map Music</h1>
  </header>

  <nav class="navegacao">
    <button class="btn nav-btn ativo" onclick="aba('escala')">📋 Escala</button>
    <button class="btn nav-btn" onclick="aba('equipe')">👥 Equipe</button>
    <button class="btn nav-btn" onclick="aba('materiais')">🎶 Repertório</button>
  </nav>

  <div id="escala" class="aba-conteudo">
    <div class="card">
      <h3>📋 Escalas</h3>
      
      <div class="seletor-data">
        <label>Escala:</label>
        <select id="lista-escalas" onchange="selecionarEscala()">
          <option value="">-- Selecione uma data --</option>
        </select>
        <button class="btn btn-primario btn-pequeno" onclick="novaEscala()">➕ Nova Escala</button>
        <button id="btn-excluir-escala" class="btn btn-perigo btn-pequeno oculto" onclick="excluirEscala()">🗑️ Excluir</button>
      </div>

      <div id="dados-escala" class="oculto">
        <div class="linha-form">
          <div class="campo">
            <label>📅 Data</label>
            <input type="date" id="data-exibicao">
          </div>
          <div class="campo">
            <label>📍 Local</label>
            <input type="text" id="local" placeholder="Ex: Templo">
          </div>
        </div>

        <h4 style="margin: 20px 0 10px;">Escala de Serviço</h4>
        <div class="escala-grade">
          
          <div class="escala-linha">
            <div class="escala-cargo">🎹 Teclado</div>
            <div class="escala-nome"><input type="text" id="i_teclado" placeholder="Nome"></div>
            <div class="escala-status"><button class="status-btn status-pendente" id="s_teclado" onclick="sts('teclado')">⏳ Pendente</button></div>
          </div>
          
          <div class="escala-linha">
            <div class="escala-cargo">🎸 Guitarra</div>
            <div class="escala-nome"><input type="text" id="i_guitarra" placeholder="Nome"></div>
            <div class="escala-status"><button class="status-btn status-pendente" id="s_guitarra" onclick="sts('guitarra')">⏳ Pendente</button></div>
          </div>
          
          <div class="escala-linha">
            <div class="escala-cargo">🎻 Contrabaixo</div>
            <div class="escala-nome"><input type="text" id="i_contrabaixo" placeholder="Nome"></div>
            <div class="escala-status"><button class="status-btn status-pendente" id="s_contrabaixo" onclick="sts('contrabaixo')">⏳ Pendente</button></div>
          </div>
          
          <div class="escala-linha">
            <div class="escala-cargo">🎸 Violão</div>
            <div class="escala-nome"><input type="text" id="i_violao" placeholder="Nome"></div>
            <div class="escala-status"><button class="status-btn status-pendente" id="s_violao" onclick="sts('violao')">⏳ Pendente</button></div>
          </div>
          
          <div class="escala-linha">
            <div class="escala-cargo">🥁 Bateria</div>
            <div class="escala-nome"><input type="text" id="i_bateria" placeholder="Nome"></div>
            <div class="escala-status"><button class="status-btn status-pendente" id="s_bateria" onclick="sts('bateria')">⏳ Pendente</button></div>
          </div>
          
          <div class="escala-linha">
            <div class="escala-cargo">📽️ Projeção</div>
            <div class="escala-nome"><input type="text" id="i_projecao" placeholder="Nome"></div>
            <div class="escala-status"><button class="status-btn status-pendente" id="s_projecao" onclick="sts('projecao')">⏳ Pendente</button></div>
          </div>
          
          <div class="escala-linha">
            <div class="escala-cargo">🎤 Ministro</div>
            <div class="escala-nome"><input type="text" id="i_ministro" placeholder="Nome"></div>
            <div class="escala-status"><button class="status-btn status-pendente" id="s_ministro" onclick="sts('ministro')">⏳ Pendente</button></div>
          </div>
          
          <div class="escala-linha">
            <div class="escala-cargo">🎤 Back Vocal</div>
            <div class="escala-nome"><input type="text" id="i_backvocal" placeholder="Nome"></div>
            <div class="escala-status"><button class="status-btn status-pendente" id="s_backvocal" onclick="sts('backvocal')">⏳ Pendente</button></div>
          </div>
          
          <div class="escala-linha">
            <div class="escala-cargo">🎤 Vocal</div>
            <div class="escala-nome"><input type="text" id="i_vocal" placeholder="Nome"></div>
            <div class="escala-status"><button class="status-btn status-pendente" id="s_vocal" onclick="sts('vocal')">⏳ Pendente</button></div>
          </div>
          
          <div class="escala-linha">
            <div class="escala-cargo">👤 Líder</div>
            <div class="escala-nome"><input type="text" id="i_lider" placeholder="Nome"></div>
            <div class="escala-status"><button class="status-btn status-pendente" id="s_lider" onclick="sts('lider')">⏳ Pendente</button></div>
          </div>
        </div>

        <div id="bloco-musicas" style="margin-top: 25px;">
          <h4 style="margin-bottom: 10px;">🎶 Músicas do Culto</h4>
          <div style="display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;">
            <input type="text" id="nome-musica" placeholder="Nome da música" style="flex:1; min-width:150px; padding:8px; border-radius:6px; border:1px solid var(--borda); background:var(--fundo); color:var(--texto);">
            <input type="url" id="link-musica" placeholder="Link YouTube" style="flex:1; min-width:150px; padding:8px; border-radius:6px; border:1px solid var(--borda); background:var(--fundo); color:var(--texto);">
            <button class="btn btn-sucesso btn-pequeno" onclick="adicionarMusica()">➕ Adicionar</button>
          </div>
          <ul id="lista-musicas"></ul>
        </div>

        <div class="botoes">
          <button id="btn-salvar" class="btn btn-primario" onclick="salvarEscala()">💾 Salvar Escala</button>
          <button class="btn btn-whatsapp" onclick="enviarWhatsApp()">📱 Enviar WhatsApp</button>
        </div>
      </div>
    </div>
  </div>

  <div id="equipe" class="aba-conteudo oculto">
    <div class="card">
      <h3>👥 Equipe</h3>
      <div id="bloco-cad-membro" class="linha-form" style="margin-bottom:20px;">
        <div class="campo">
          <label>Nome</label>
          <input type="text" id="nome-membro" placeholder="Nome completo">
        </div>
        <div class="campo">
          <label>Função</label>
          <select id="funcao-membro">
            <option value="teclado">Teclado</option>
            <option value="guitarra">Guitarra</option>
            <option value="contrabaixo">Contrabaixo</option>
            <option value="violao">Violão</option>
            <option value="bateria">Bateria</option>
            <option value="projecao">Projeção</option>
            <option value="ministro">Ministro</option>
            <option value="backvocal">Back Vocal</option>
            <option value="vocal">Vocal</option>
            <option value="lider">Líder</option>
          </select>
        </div>
        <button class="btn btn-primario" onclick="cadastrarMembro()">➕ Cadastrar</button>
      </div>
      <ul id="lista-membros"></ul>
    </div>
  </div>

  <div id="materiais" class="aba-conteudo oculto">
    <div class="card">
      <h3>🎶 Repertório</h3>
      <div id="bloco-cad-musica" class="linha-form" style="margin-bottom:20px;">
        <div class="campo">
          <label>Nome da Música</label>
          <input type="text" id="musica-nome" placeholder="Nome">
        </div>
        <div class="campo">
          <label>Link YouTube</label>
          <input type="url" id="musica-link" placeholder="https://...">
        </div>
        <button class="btn btn-primario" onclick="cadastrarMusica()">➕ Adicionar</button>
      </div>
      <ul id="lista-repertorio"></ul>
    </div>
  </div>
</div>
<script>
let usuario = null;
let perfil = null;
let escalaAtualData = null;
let listaEscalas = [];
let musicasCulto = [];
let stsMap = {};

const cargos = [
  {chave:'teclado',nome:'Teclado',icone:'🎹'},
  {chave:'guitarra',nome:'Guitarra',icone:'🎸'},
  {chave:'contrabaixo',nome:'Contrabaixo',icone:'🎻'},

  {chave:'ministro',nome:'Ministro',icone:'🎤'},
  {chave:'backvocal',nome:'Back Vocal',icone:'🎤'},
  {chave:'vocal',nome:'Vocal',icone:'🎤'},

  document.getElementById
let usuario = null;
let perfil = null;
let escalaAtualData = null;
let listaEscalas = [];
let musicasCulto = [];
let stsMap = {};

const cargos = [
  {chave:'teclado',nome:'Teclado',icone:'🎹'},
  {chave:'guitarra',nome:'Guitarra',icone:'🎸'},
  {chave:'contrabaixo',nome:'Contrabaixo',icone:'🎻'},
  {chave:'violao',nome:'Violão',icone:'🎸'},
  {chave:'bateria',nome:'Bateria',icone:'🥁'},
  {chave:'projecao',nome:'Projeção',icone:'📽️'},
  {chave:'ministro',nome:'Ministro',icone:'🎤'},
  {chave:'backvocal',nome:'Back Vocal',icone:'🎤'},
  {chave:'vocal',nome:'Vocal',icone:'🎤'},
  {chave:'lider',nome:'Líder',icone:'👤'}
];

cargos.forEach(c => stsMap[c.chave] = 'pendente');

function aplicarPermissoes() {
  const ehLider = (perfil === 'lider');
  document.getElementById('btn-salvar').classList.toggle('oculto', !ehLider);
  document.getElementById('btn-excluir-escala').classList.toggle('oculto', !ehLider);
  document.getElementById('bloco-cad-membro').classList.toggle('oculto', !ehLider);
  document.getElementById('bloco-cad-musica').classList.toggle('oculto', !ehLider);
  document.getElementById('bloco-musicas').classList.toggle('oculto', !ehLider);
  
  document.getElementById('data-exibicao').disabled = !ehLider;
  document.getElementById('local').disabled = !ehLider;
  cargos.forEach(c => {
    const inp = document.getElementById(`i_${c.chave}`);
    if (inp) inp.disabled = !ehLider;
  });
}

async function entrar() {
  const u = document.getElementById('usuario').value.trim();
  const s = document.getElementById('senha').value;
  const res = await fetch('/api/login', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({usuario:u, senha:s})
  });
  const d = await res.json();
  
  if (d.sucesso) {
    usuario = d.usuario;
    perfil = d.nivel;
    document.getElementById('tela-login').style.display = 'none';
    document.getElementById('tela-principal').classList.add('ativa');
    aplicarPermissoes();
    carregarListaEscalas();
  } else {
    document.getElementById('msg-login').textContent = d.mensagem;
  }
}

function sair() {
  usuario = null; perfil = null; escalaAtualData = null;
  document.getElementById('tela-principal').classList.remove('ativa');
  document.getElementById('tela-login').style.display = 'flex';
  document.getElementById('usuario').value = '';
  document.getElementById('senha').value = '';
  document.getElementById('msg-login').textContent = '';
}

function aba(nome) {
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('ativo'));
  event.target.classList.add('ativo');
  document.querySelectorAll('.aba-conteudo').forEach(a=>a.classList.add('oculto'));
  document.getElementById(nome).classList.remove('oculto');
  aplicarPermissoes();
  
  if (nome==='escala') carregarListaEscalas();
  if (nome==='equipe') carregarEquipe();
  if (nome==='materiais') carregarRepertorio();
}

function formatarData(dataStr) {
  if (!dataStr) return '';
  const [ano, mes, dia] = dataStr.split('-');
  return `${dia}/${mes}/${ano}`;
}
async function carregarListaEscalas() {
  const res = await fetch('/api/escala');
  listaEscalas = await res.json();
  
  const sel = document.getElementById('lista-escalas');
  sel.innerHTML = '<option value="">-- Selecione uma data --</option>';
  listaEscalas.forEach(e => {
    const opt = document.createElement('option');
    opt.value = e.dataExibicao;
    opt.textContent = formatarData(e.dataExibicao) + (e.local ? ` — ${e.local}` : '');
    sel.appendChild(opt);
  });
  
  if (escalaAtualData) {
    sel.value = escalaAtualData;
    document.getElementById('dados-escala').classList.remove('oculto');
  } else {
    document.getElementById('dados-escala').classList.add('oculto');
  }
}

async function novaEscala() {
  if (perfil !== 'lider') { alert('Apenas o líder pode criar escalas!'); return; }
  
  const dataEscolhida = prompt('Digite a data da escala (AAAA-MM-DD):\nExemplo: 2026-10-29');
  if (!dataEscolhida) return;
  
  const existe = listaEscalas.some(e => e.dataExibicao === dataEscolhida);
  if (existe) {
    alert('Já existe uma escala para esta data! Selecione na lista.');
    document.getElementById('lista-escalas').value = dataEscolhida;
    selecionarEscala();
    return;
  }
  
  escalaAtualData = dataEscolhida;
  document.getElementById('lista-escalas').value = dataEscolhida;
  document.getElementById('data-exibicao').value = dataEscolhida;
  document.getElementById('local').value = '';
  musicasCulto = [];
  cargos.forEach(c => {
    document.getElementById(`i_${c.chave}`).value = '';
    stsMap[c.chave] = 'pendente';
    atualizarBotaoStatus(c.chave);
  });
  renderizarMusicasCulto();
  document.getElementById('dados-escala').classList.remove('oculto');
  aplicarPermissoes();
}

async function selecionarEscala() {
  const sel = document.getElementById('lista-escalas');
  escalaAtualData = sel.value;
  
  if (!escalaAtualData) {
    document.getElementById('dados-escala').classList.add('oculto');
    return;
  }
  
  document.getElementById('dados-escala').classList.remove('oculto');
  await carregarEscala(escalaAtualData);
}

async function carregarEscala(dataEscolhida) {
  const res = await fetch(`/api/escala?data=${encodeURIComponent(dataEscolhida)}`);
  const e = await res.json();
  
  document.getElementById('data-exibicao').value = e.dataExibicao || dataEscolhida;
  document.getElementById('local').value = e.local || '';
  musicasCulto = e.cultoMusicas || [];
  renderizarMusicasCulto();
  
  cargos.forEach(c => {
    const inp = document.getElementById(`i_${c.chave}`);
    if (inp) inp.value = e[c.chave] || '';
    const sk = 'status' + c.chave.charAt(0).toUpperCase() + c.chave.slice(1);
    stsMap[c.chave] = e[sk] || 'pendente';
    atualizarBotaoStatus(c.chave);
  });
  
  aplicarPermissoes();
}

async function excluirEscala() {
  if (!confirm('Tem certeza que deseja EXCLUIR esta escala?\nEssa ação não pode ser desfeita!')) return;
  
  const res = await fetch(`/api/escala/${escalaAtualData}`, { method: 'DELETE' });
  if (res.ok) {
    escalaAtualData = null;
    document.getElementById('dados-escala').classList.add('oculto');
    await carregarListaEscalas();
    alert('✅ Escala excluída!');
  }
}

function atualizarBotaoStatus(cargo) {
  const btn = document.getElementById(`s_${cargo}`);
  if (!btn) return;
  btn.className = '';
  btn.classList.add('status-btn', `status-${stsMap[cargo]}`);
  btn.textContent = stsMap[cargo]==='confirmado'?'✅ Disponível':stsMap[cargo]==='recusado'?'❌ Indisponível':'⏳ Pendente';
}

async function sts(cargo) {
  const a = stsMap[cargo];
  if (a==='pendente') stsMap[cargo]='confirmado';
  else if (a==='confirmado') stsMap[cargo]='recusado';
  else stsMap[cargo]='pendente';
  
  atualizarBotaoStatus(cargo);
  await salvarApenasStatus();
}

function adicionarMusica() {
  if (perfil !== 'lider') return;
  const nome = document.getElementById('nome-musica').value.trim();
  const link = document.getElementById('link-musica').value.trim();
  if (!nome) { alert('Digite o nome da música!'); return; }
  
  musicasCulto.push({ id: Date.now(), nome, link });
  document.getElementById('nome-musica').value = '';
  document.getElementById('link-musica').value = '';
  renderizarMusicasCulto();
}

function removerMusicaCulto(id) {
  if (perfil !== 'lider') return;
  musicasCulto = musicasCulto.filter(m => m.id !== id);
  renderizarMusicasCulto();
}

function renderizarMusicasCulto() {
  const ul = document.getElementById('lista-musicas');
  if (musicasCulto.length === 0) {
    ul.innerHTML = '<li style="padding:8px; color:var(--texto-suave); font-style:italic;">Nenhuma música adicionada.</li>';
    return;
  }
  const ehLider = (perfil === 'lider');
  ul.innerHTML = musicasCulto.map(m => `
    <li style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid var(--borda);">
      <div>
        <strong>${m.nome}</strong>
        ${m.link ? `<br><a href="${m.link}" target="_blank" style="font-size:12px;">🔗 ${m.link}</a>` : ''}
      </div>
      ${ehLider ? `<button class="btn btn-perigo btn-pequeno" onclick="removerMusicaCulto(${m.id})">🗑️</button>` : ''}
    </li>
  `).join('');
}

function enviarWhatsApp() {
  if (!escalaAtualData) { alert('Selecione uma escala primeiro!'); return; }
  
  const data = document.getElementById('data-exibicao').value;
  const local = document.getElementById('local').value || '---';
  const dataFormatada = data ? data.split('-').reverse().join('/') : '---';
  
  let texto = `📋 ESCALA - Ministério de Louvor\n📅 Data: ${dataFormatada}\n📍 Local: ${local}\n\n👥 EQUIPE:\n`;
  
  cargos.forEach(c => {
    const nome = document.getElementById(`i_${c.chave}`).value || '—';
    const s = stsMap[c.chave]==='confirmado'?'✅ Disponível':stsMap[c.chave]==='recusado'?'❌ Indisponível':'⏳ Pendente';
    texto += `${c.icone} ${c.nome}: ${nome} — ${s}\n`;
  });
  
  if (musicasCulto.length > 0) {
    texto += '\n🎶 MÚSICAS DO CULTO:\n';
    musicasCulto.forEach(m => {
      texto += `🎵 ${m.nome}`;
      if (m.link) texto += `\n🔗 ${m.link}`;
      texto += '\n';
    });
  }
  
  window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank');
}

async function carregarEquipe() {
  const res = await fetch('/api/equipe');
  const membros = await res.json();
  const ul = document.getElementById('lista-membros');
  const ehLider = (perfil === 'lider');
  
  if (membros.length === 0) {
    ul.innerHTML = '<li class="vazio">Nenhum membro cadastrado.</li>';
    return;
  }
  
  ul.innerHTML = membros.map(m => `
    <li class="item">
      <div>
        <div class="item-nome">${m.nome}</div>
        <div class="item-info">${m.funcao}</div>
      </div>
      ${ehLider ? `<button class="btn btn-perigo btn-pequeno" onclick="excluirMembro(${m.id})">🗑️ Excluir</button>` : ''}
    </li>
  `).join('');
}

async function cadastrarMembro() {
  if (perfil !== 'lider') return;
  const nome = document.getElementById('nome-membro').value.trim();
  const funcao = document.getElementById('funcao-membro').value;
  if (!nome) { alert('Digite o nome!'); return; }
  
  await fetch('/api/equipe', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({nome, funcao})
  });
  
  document.getElementById('nome-membro').value = '';
  carregarEquipe();
}

async function excluirMembro(id) {
  if (!confirm('Excluir este membro?')) return;
  await fetch(`/api/equipe/${id}`, { method: 'DELETE' });
  carregarEquipe();
}
