<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ministério de Louvor | Map Music</title>
    <meta name="theme-color" content="#10B981">
    
    <link rel="manifest" href="manifest.json">
    <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js');
      });
    }
    </script>
    
    <style>
        :root {
            --fundo: #0f172a;
            --fundo-card: #1e293b;
            --texto: #f1f5f9;
            --texto-suave: #94a3b8;
            --primaria: #10B981;
            --primaria-escura: #059669;
            --secundaria: #3b82f6;
            --perigo: #ef4444;
            --aviso: #f59e0b;
            --borda: #334155;
            --sucesso: #22c55e;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--fundo); color: var(--texto); min-height: 100vh; }
        .tela { display: none; padding: 20px; max-width: 900px; margin: 0 auto; }
        .tela.ativa { display: block; }
        .login-tela { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        .login-container { background: var(--fundo-card); padding: 40px 30px; border-radius: 16px; max-width: 400px; width: 100%; border: 1px solid var(--borda); text-align: center; }
        .login-logo { font-size: 48px; margin-bottom: 10px; }
        .login-container h2 { color: var(--primaria); font-size: 22px; margin-bottom: 5px; }
        .login-container p { color: var(--texto-suave); margin-bottom: 25px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; margin-bottom: 8px; color: var(--texto-suave); font-size: 14px; }
        .input-group input { width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid var(--borda); background: var(--fundo); color: var(--texto); font-size: 16px; }
        .btn { padding: 12px 20px; border-radius: 8px; border: none; font-size: 15px; cursor: pointer; }
        .btn-primario { background: var(--primaria); color: white; width: 100%; }
        .btn-perigo { background: var(--perigo); color: white; }
        .btn-sucesso { background: var(--sucesso); color: white; }
        .btn-pequeno { padding: 6px 12px; font-size: 13px; }
        .cabecalho { text-align: center; padding: 20px 0; margin-bottom: 25px; border-bottom: 1px solid var(--borda); }
        .cabecalho h1 { font-size: 24px; color: var(--primaria); }
        .navegacao { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 25px; justify-content: center; }
        .nav-btn { background: var(--fundo-card); color: var(--texto-suave); border: 1px solid var(--borda); }
        .nav-btn.ativo { background: var(--primaria); color: white; border-color: var(--primaria); }
        .sair-btn { position: absolute; top: 20px; right: 20px; background: var(--perigo); color: white; border: none; }
        .card { background: var(--fundo-card); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--borda); }
        .card h3 { color: var(--primaria); margin-bottom: 15px; font-size: 18px; }
        .linha-form { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 15px; }
        .campo { flex: 1; min-width: 180px; }
        .campo label { display: block; font-size: 13px; color: var(--texto-suave); margin-bottom: 5px; }
        .campo input, .campo select { width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--borda); background: var(--fundo); color: var(--texto); }
        .lista-itens { list-style: none; }
        .item { padding: 12px; border-bottom: 1px solid var(--borda); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .item-nome { font-weight: 500; }
        .item-info { font-size: 13px; color: var(--texto-suave); }
        .acoes { display: flex; gap: 6px; }
        .status-btn { padding: 4px 10px; border-radius: 20px; font-size: 12px; border: none; cursor: pointer; }
        .status-confirmado { background: var(--sucesso); color: white; }
        .status-pendente { background: var(--aviso); color: white; }
        .status-recusado { background: var(--perigo); color: white; }
        .ensaiada { background: var(--sucesso); color: white; }
        .nao-ensaiada { background: var(--perigo); color: white; }
        .btn-whatsapp { background: #25d366; color: white; }
        .escala-grade { display: grid; gap: 10px; }
        .escala-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--fundo); border-radius: 8px; border: 1px solid var(--borda); }
        .escala-instrumento { font-weight: 500; display: flex; align-items: center; gap: 8px; }
        .escala-pessoa { color: var(--texto-suave); font-size: 14px; }
        .escala-status { display: flex; gap: 6px; }
        .oculto { display: none !important; }
        .sem-dados { text-align: center; padding: 30px; color: var(--texto-suave); font-style: italic; }
        .mensagem { padding: 12px; border-radius: 8px; margin-bottom: 15px; display: none; }
        .mensagem.sucesso { background: rgba(34,197,94,0.1); border: 1px solid var(--sucesso); color: var(--sucesso); display: block; }
        .mensagem.erro { background: rgba(239,68,68,0.1); border: 1px solid var(--perigo); color: var(--perigo); display: block; }
        a { color: var(--secundaria); text-decoration: none; }
        @media (max-width: 600px) {
            .linha-form { flex-direction: column; }
            .sair-btn { position: static; margin-bottom: 15px; width: 100%; }
        }
    </style>
</head>
<body>
    <div id="tela-login" class="login-tela">
        <div class="login-container">
            <div class="login-logo">🎵</div>
            <h2>Ministério de Louvor</h2>
            <p>Map Music</p>
            <div id="mensagem-login" class="mensagem"></div>
            <div class="input-group">
                <label>Usuário</label>
                <input type="text" id="usuario" placeholder="Digite seu usuário">
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha">
            </div>
            <button class="btn btn-primario" onclick="fazerLogin()">Entrar</button>
        </div>
    </div>
    <div id="tela-principal" class="tela">
        <button class="btn sair-btn" onclick="sair()">Sair</button>
        
        <header class="cabecalho">
            <h1>🎵 Map Music</h1>
        </header>
        
        <nav class="navegacao">
            <button class="btn nav-btn ativo" onclick="mostrarAba('escala')">📋 Escala</button>
            <button class="btn nav-btn" onclick="mostrarAba('equipe')">👥 Equipe</button>
            <button class="btn nav-btn" onclick="mostrarAba('repertorio')">🎶 Materiais</button>
        </nav>
        <!-- ABA ESCALA -->
        <div id="aba-escala" class="aba-conteudo">
            <div class="card">
                <h3>📅 Dados da Escala</h3>
                <div class="linha-form">
                    <div class="campo">
                        <label>Data</label>
                        <input type="date" id="escala-data">
                    </div>
                    <div class="campo">
                        <label>Local</label>
                        <input type="text" id="escala-local" placeholder="Ex: Templo Central">
                    </div>
                </div>
            </div>
            <div class="card">
                <h3>🎹 Montar Escala</h3>
                <div class="escala-grade" id="escala-corpo"></div>
                <div style="margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
                    <button class="btn btn-primario" onclick="salvarEscala()">💾 Salvar Escala</button>
                    <button class="btn btn-whatsapp" onclick="enviarWhatsApp()">📱 Enviar WhatsApp</button>
                </div>
            </div>
        </div>

        <!-- ABA EQUIPE -->
        <div id="aba-equipe" class="aba-conteudo oculto">
            <div class="card">
                <h3>➕ Adicionar Membro</h3>
                <div class="linha-form">
                    <div class="campo">
                        <label>Nome</label>
                        <input type="text" id="membro-nome" placeholder="Nome completo">
                    </div>
                    <div class="campo">
                        <label>Função</label>
                        <select id="membro-funcao">
                            <option value="ministro">Ministro</option>
                            <option value="backvocal">Back Vocal</option>
                            <option value="teclado">Teclado</option>
                            <option value="guitarra">Guitarra</option>
                            <option value="violao">Violão</option>
                            <option value="contrabaixo">Contrabaixo</option>
                            <option value="bateria">Bateria</option>
                            <option value="lider">Líder</option>
                        </select>
                    </div>
                </div>
                <button class="btn btn-primario" onclick="adicionarMembro()">➕ Adicionar</button>
            </div>
            <div class="card">
                <h3>👥 Equipe</h3>
                <ul id="lista-equipe" class="lista-itens">
                    <li class="sem-dados">Carregando...</li>
                </ul>
            </div>
        </div>

        <!-- ABA MATERIAIS -->
        <div id="aba-repertorio" class="aba-conteudo oculto">
            <div class="card">
                <h3>🎶 Adicionar Música</h3>
                <div class="linha-form">
                    <div class="campo">
                        <label>Nome da Música</label>
                        <input type="text" id="musica-nome" placeholder="Digite o nome">
                    </div>
                    <div class="campo">
                        <label>Link (YouTube)</label>
                        <input type="url" id="musica-link" placeholder="https://...">
                    </div>
                </div>
                <button class="btn btn-primario" onclick="adicionarMusica()">➕ Adicionar Música</button>
            </div>
            <div class="card">
                <h3>📚 Repertório</h3>
                <ul id="lista-repertorio" class="lista-itens">
                    <li class="sem-dados">Nenhuma música cadastrada ainda.</li>
                </ul>
            </div>
        </div>
    </div>
    <script>
        let usuarioLogado = null;
        let nivelUsuario = null;
        window.escalaAtual = {};

        const cargos = [
            {chave: 'ministro', nome: 'Ministro', icone: '🎤'},
            {chave: 'backvocal', nome: 'Back Vocal', icone: '🎤'},
            {chave: 'teclado', nome: 'Teclado', icone: '🎹'},
            {chave: 'guitarra', nome: 'Guitarra', icone: '🎸'},
            {chave: 'violao', nome: 'Violão', icone: '🎸'},
            {chave: 'contrabaixo', nome: 'Contrabaixo', icone: '🎻'},
            {chave: 'bateria', nome: 'Bateria', icone: '🥁'},
            {chave: 'lider', nome: 'Líder', icone: '👤'}
        ];

        async function fazerLogin() {
            const usuario = document.getElementById('usuario').value.trim();
            const senha = document.getElementById('senha').value;
            const msg = document.getElementById('mensagem-login');
            
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({usuario, senha})
            });
            const dados = await res.json();
            
            if (dados.sucesso) {
                usuarioLogado = dados.usuario;
                nivelUsuario = dados.nivel;
                document.getElementById('tela-login').style.display = 'none';
                document.getElementById('tela-principal').classList.add('ativa');
                carregarTudo();
            } else {
                msg.textContent = dados.mensagem;
                msg.className = 'mensagem erro';
                setTimeout(() => msg.className = 'mensagem', 3000);
            }
        }

        function sair() {
            usuarioLogado = null;
            document.getElementById('tela-principal').classList.remove('ativa');
            document.getElementById('tela-login').style.display = 'flex';
            document.getElementById('usuario').value = '';
            document.getElementById('senha').value = '';
        }

        function mostrarAba(nome) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('ativo'));
            event.target.classList.add('ativo');
            document.querySelectorAll('.aba-conteudo').forEach(a => a.classList.add('oculto'));
            document.getElementById(`aba-${nome}`).classList.remove('oculto');
            if (nome === 'escala') carregarEscala();
            if (nome === 'equipe') carregarEquipe();
            if (nome === 'repertorio') carregarRepertorio();
        }

        function montarLinhaInstrumento(cargo, valor, status) {
            return `
                <div class="escala-item">
                    <div class="escala-instrumento">${cargo.icone} ${cargo.nome}</div>
                    <div class="escala-pessoa" id="escala-valor-${cargo.chave}">${valor || '—'}</div>
                    <div class="escala-status">
                        <button class="btn status-btn status-${status}" onclick="trocarStatus('${cargo.chave}')">
                            ${status === 'confirmado' ? '✅ Disponível' : status === 'recusado' ? '❌ Indisponível' : '⏳ Pendente'}
                        </button>
                    </div>
                </div>
            `;
        }

        async function carregarEscala() {
            const res = await fetch('/api/escala');
            const esc = await res.json();
            document.getElementById('escala-data').value = esc.dataExibicao || '';
            document.getElementById('escala-local').value = esc.local || '';
            
            let html = '';
            cargos.forEach(c => {
                const statusKey = 'status' + c.chave.charAt(0).toUpperCase() + c.chave.slice(1);
                html += montarLinhaInstrumento(c, esc[c.chave], esc[statusKey] || 'pendente');
            });
            document.getElementById('escala-corpo').innerHTML = html;
            window.escalaAtual = esc;
        }

        function trocarStatus(chave) {
            const statusKey = 'status' + chave.charAt(0).toUpperCase() + chave.slice(1);
            const atual = window.escalaAtual[statusKey] || 'pendente';
            let novo = atual === 'pendente' ? 'confirmado' : atual === 'confirmado' ? 'recusado' : 'pendente';
            window.escalaAtual[statusKey] = novo;
            carregarEscala();
        }

        async function salvarEscala() {
            const data = document.getElementById('escala-data').value;
            const local = document.getElementById('escala-local').value;
            
            const escala = {
                dataExibicao: data, local: local,
                ministro: document.getElementById('escala-valor-ministro')?.textContent.trim() || '',
                backvocal: document.getElementById('escala-valor-backvocal')?.textContent.trim() || '',
                teclado: document.getElementById('escala-valor-teclado')?.textContent.trim() || '',
                guitarra: document.getElementById('escala-valor-guitarra')?.textContent.trim() || '',
                violao: document.getElementById('escala-valor-violao')?.textContent.trim() || '',
                contrabaixo: document.getElementById('escala-valor-contrabaixo')?.textContent.trim() || '',
                bateria: document.getElementById('escala-valor-bateria')?.textContent.trim() || '',
                lider: document.getElementById('escala-valor-lider')?.textContent.trim() || '',
                repertorio: window.escalaAtual?.repertorio || [],
                statusTeclado: window.escalaAtual?.statusTeclado || 'pendente',
                statusGuitarra: window.escalaAtual?.statusGuitarra || 'pendente',
                statusContrabaixo: window.escalaAtual?.statusContrabaixo || 'pendente',
                statusViolao: window.escalaAtual?.statusViolao || 'pendente',
                statusBateria: window.escalaAtual?.statusBateria || 'pendente',
                statusMinistro: window.escalaAtual?.statusMinistro || 'pendente',
                statusBackvocal: window.escalaAtual?.statusBackvocal || 'pendente',
                statusLider: window.escalaAtual?.statusLider || 'pendente'
            };

            try {
                const res = await fetch('/api/escala', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(escala)
                });
                await res.json();
                alert('✅ Escala salva com sucesso!');
                carregarEscala();
            } catch (erro) {
                alert('❌ Erro ao salvar: ' + erro.message);
            }
        }

        function enviarWhatsApp() {
            const data = document.getElementById('escala-data').value || '---';
            const local = document.getElementById('escala-local').value || '---';
            let texto = `📋 ESCALA - Ministério de Louvor\n📅 Data: ${data}\n📍 Local: ${local}\n\n`;
            cargos.forEach(c => {
                const nome = document.getElementById(`escala-valor-${c.chave}`)?.textContent.trim() || '—';
                texto += `${c.icone} ${c.nome}: ${nome}\n`;
            });
            window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank');
        }
    <script>
        async function carregarEquipe() {
            const res = await fetch('/api/equipe');
            const membros = await res.json();
            const lista = document.getElementById('lista-equipe');
            if (membros.length === 0) {
                lista.innerHTML = '<li class="sem-dados">Nenhum membro cadastrado ainda.</li>';
                return;
            }
            lista.innerHTML = membros.map(m => `
                <li class="item">
                    <div>
                        <div class="item-nome">${m.nome}</div>
                        <div class="item-info">${m.funcao}</div>
                    </div>
                    <div class="acoes">
                        <button class="btn btn-perigo btn-pequeno" onclick="excluirMembro(${m.id})">🗑️</button>
                    </div>
                </li>
            `).join('');
        }

        async function adicionarMembro() {
            const nome = document.getElementById('membro-nome').value.trim();
            const funcao = document.getElementById('membro-funcao').value;
            if (!nome) { alert('Digite o nome!'); return; }
            await fetch('/api/equipe', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({nome, funcao})
            });
            document.getElementById('membro-nome').value = '';
            carregarEquipe();
        }

        async function excluirMembro(id) {
            if (!confirm('Excluir este membro?')) return;
            await fetch(`/api/equipe/${id}`, {method: 'DELETE'});
            carregarEquipe();
        }

        async function carregarRepertorio() {
            const res = await fetch('/api/repertorio');
            const musicas = await res.json();
            const lista = document.getElementById('lista-repertorio');
            if (musicas.length === 0) {
                lista.innerHTML = '<li class="sem-dados">Nenhuma música cadastrada ainda.</li>';
                return;
            }
            lista.innerHTML = musicas.map(m => `
                <li class="item">
                    <div>
                        <div class="item-nome">${m.nome}</div>
                        <div class="item-info">
                            ${m.link ? `<a href="${m.link}" target="_blank">🔗 Abrir link</a>` : 'Sem link'}
                        </div>
                    </div>
                    <div class="acoes">
                        <button class="btn status-btn ${m.ensaiada ? 'ensaiada' : 'nao-ensaiada'}" 
                                onclick="alternarStatusMusica(${m.id}, ${m.ensaiada ? 0 : 1})">
                            ${m.ensaiada ? '✅ Ensaiada' : '❌ Não Ensaiada'}
                        </button>
                        <button class="btn btn-perigo btn-pequeno" onclick="excluirMusica(${m.id})">🗑️</button>
                    </div>
                </li>
            `).join('');
        }

        async function adicionarMusica() {
            const nome = document.getElementById('musica-nome').value.trim();
            const link = document.getElementById('musica-link').value.trim();
            if (!nome) { alert('Digite o nome da música!'); return; }
            await fetch('/api/repertorio', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({nome, link, ensaiada: 0})
            });
            document.getElementById('musica-nome').value = '';
            document.getElementById('musica-link').value = '';
            carregarRepertorio();
        }

        async function alternarStatusMusica(id, ensaiada) {
            await fetch(`/api/repertorio/${id}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ensaiada})
            });
            carregarRepertorio();
        }

        async function excluirMusica(id) {
            if (!confirm('Excluir esta música?')) return;
            await fetch(`/api/repertorio/${id}`, {method: 'DELETE'});
            carregarRepertorio();
        }

        function carregarTudo() {
            carregarEscala();
            carregarEquipe();
            carregarRepertorio();
        }
    </script>
</body>
</html>
